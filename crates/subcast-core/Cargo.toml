[package]
name = "subcast-core"
version = "0.3.3"
license = "AGPL-3.0-only"
description = "Core library for SubCast — subscriptions, transcripts, ASR, AI workflows, media clipping and vocab"
authors = ["Qiaomu"]
edition = "2024"

[dependencies]
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "gzip", "brotli", "system-proxy", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-pki-types = "1"
webpki-roots = "1"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
roxmltree = "0.20"
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "wav", "flac", "ogg", "vorbis", "pcm"] }
anyhow = "1"
once_cell = "1"
urlencoding = "2"
dirs = "5"
flate2 = "1"
bzip2 = "0.6"
tar = "0.4"
base64 = "0.22"
rusty-chromaprint = "0.3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
cosmic-text = "0.12"
tiny-skia = "0.11"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.14"
