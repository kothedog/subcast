[package]
name = "subcast"
version = "0.3.11"
license = "AGPL-3.0-only"
description = "SubCast · 声渡 — overseas podcasts and YouTube with bilingual subtitles and AI Q&A"
authors = ["Qiaomu"]
edition = "2024"

[lib]
name = "subcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
parking_lot = "0.12"
subcast-core = { path = "../crates/subcast-core" }
tauri = { version = "2", features = ["protocol-asset", "macos-proxy"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
minisign-verify = "0.3"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
dirs = "5"
flate2 = "1"
tar = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
# The login shell, for the PATH new terminals use (clipath.rs).
libc = "0.2"
